name: Publish co-learning Demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'up-focus-club/dist/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out Demo
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static Demo
        uses: actions/upload-pages-artifact@v3
        with:
          path: up-focus-club/dist
      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@v5
