<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#365345">
<title>手机版 Demo · 周周阿朴共学室</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}body{min-height:100dvh;background:#e5e9e3;display:grid;place-items:center;padding:22px}.phone{width:390px;max-width:100%;height:min(844px,calc(100dvh - 44px));min-height:420px;border:7px solid #304638;border-radius:32px;overflow:hidden;box-shadow:0 18px 50px #233b3425;background:#fffdf6}.phone iframe{display:block;width:100%;height:100%;border:0;background:#fffdf6}@media(max-width:560px){body{padding:0;background:#fffdf6;display:block}.phone{width:100%;height:100dvh;min-height:0;border:0;border-radius:0;box-shadow:none}}@media(max-height:460px) and (min-width:561px){body{padding:8px}.phone{height:calc(100dvh - 16px);min-height:0}}
</style>
</head>
<body>
<main class="phone" aria-label="周周阿朴共学室手机版">
<iframe title="可操作的共学室手机版 Demo" src="about:blank" allow="autoplay; fullscreen" allowfullscreen></iframe>
</main>
<script>
const views={wechat:'./?view=wechat',waiting:'./?view=waiting',results:'classroom.html?day=0',reminders:'wechat-reminders.html'};
const scene=new URLSearchParams(location.search).get('scene');
const target=new URL(views[scene]||views.wechat,location.href);
target.searchParams.set('preview','mobile-r8');
document.querySelector('iframe').src=target.href;
</script>
</body>
</html>
